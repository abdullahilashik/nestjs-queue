services:
  redis:
    image: redis:7.4-alpine
    container_name: redis_server
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-mysecurepassword}" --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mysecurepassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-mysecurepassword}
    ports:
      - "8081:8081"

volumes:
  redis_data: